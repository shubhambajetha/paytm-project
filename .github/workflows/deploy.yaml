name: Build and Deploy to Docker Hub

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Docker Secrets
        shell: bash
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Username length: ${#DOCKER_USER}"
          echo "Password length: ${#DOCKER_PASS}"

          if [ -z "$DOCKER_USER" ]; then
            echo "ERROR: DOCKER_USERNAME is EMPTY"
            exit 1
          fi

          if [ -z "$DOCKER_PASS" ]; then
            echo "ERROR: DOCKER_PASSWORD is EMPTY"
            exit 1
          fi

          echo "Username received: YES"
          echo "Password received: YES"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/docker/Dockerfile.user
          push: true
          tags: shubhiiiiii/paytemproject:latest